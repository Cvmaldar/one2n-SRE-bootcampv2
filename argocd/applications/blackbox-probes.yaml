apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-probes
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Cvmaldar/one2n-SRE-bootcampv2.git
    targetRevision: main
    path: helm/observability/probes

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
