apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default

  sources:
  - repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: "6.29.0"
    helm:
      releaseName: loki
      valueFiles:
      - $values/helm/observability/loki/values.yaml

  - repoURL: https://github.com/Cvmaldar/one2n-SRE-bootcampv2.git
    targetRevision: main
    ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
    - CreateNamespace=true
