apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Cvmaldar/one2n-SRE-bootcampv2.git
    targetRevision: main
    path: helm/external-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: student-api

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
