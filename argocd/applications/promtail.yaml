apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail
  namespace: argocd
spec:
  project: default

  sources:
  - repoURL: https://grafana.github.io/helm-charts
    chart: promtail
    targetRevision: "6.17.0"
    helm:
      releaseName: promtail
      valueFiles:
      - $values/helm/observability/promtail/values.yaml

  - repoURL: <YOUR_GITHUB_REPO_URL>
    targetRevision: main
    ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
    - CreateNamespace=true
