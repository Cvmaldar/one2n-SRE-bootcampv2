services:

  postgres:
    image: postgres:17-alpine
    container_name: student-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studentdb

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studentdb"]
      interval: 5s
      timeout: 5s
      retries: 5


  student-api-1:
    image: student-api:1.0.1
    container_name: student-api-1

    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: studentdb
      DB_SSLMODE: disable

    depends_on:
      postgres:
        condition: service_healthy


  student-api-2:
    image: student-api:1.0.1
    container_name: student-api-2

    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: studentdb
      DB_SSLMODE: disable

    depends_on:
      postgres:
        condition: service_healthy


  nginx:
    image: nginx:alpine
    container_name: student-nginx

    ports:
      - "8080:8080"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - student-api-1
      - student-api-2


volumes:
  postgres_data: