replicaCount: 2

image:
  repository: cvmaldar234/student-api
  tag: "1.0.6"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

nodeSelector:
  type: application

config:
  PORT: "8080"
  DB_HOST: "student-api-db"
  DB_PORT: "5432"
  DB_NAME: "student_api"
  DB_SSLMODE: "disable"

migration:
  image:
    repository: cvmaldar234/student-api-migrate
    tag: "1.0.0"
