apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: student-api-db-secret
  namespace: student-api
spec:
  refreshInterval: 1m

  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: student-api-db-secret

  data:
  - secretKey: DB_USERNAME
    remoteRef:
      key: secret/data/student-api
      property: DB_USERNAME

  - secretKey: DB_PASSWORD
    remoteRef:
      key: secret/data/student-api
      property: DB_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault-service.vault.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: external-secrets-system
          key: token
