name: Student API CI

on:
  push:
    paths:
    - 'cmd/**'
    - 'internal/**'
    - 'go.mod'
    - 'go.sum'
    - 'Dockerfile'
    - 'Makefile'
  workflow_dispatch:


jobs:
  ci:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build API
      run: make build

    - name: Run tests
      run: make test

    - name: Run lint
      run: make lint

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/student-api:1.0.1 .

    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/student-api:1.0.1
