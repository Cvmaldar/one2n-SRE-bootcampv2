name: Student API CI

on:
  push:
    paths:
    - 'cmd/**'
    - 'internal/**'
    - 'go.mod'
    - 'go.sum'
    - 'Dockerfile'
    - 'Makefile'
  workflow_dispatch:


jobs:
  ci:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build API
      run: make build

    - name: Run tests
      run: make test

    - name: Run lint
      run: make lint
