name: Student API CI

on:
  push:
    paths:
    - 'cmd/**'
    - 'internal/**'
    - 'go.mod'
    - 'go.sum'
    - 'Dockerfile'
    - 'Makefile'
  workflow_dispatch:


jobs:
  ci:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build API
      run: make build

    - name: Run tests
      run: make test

    - name: Run lint
      run: make lint

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set image tag
      run: echo "IMAGE_TAG=1.0.${{ github.run_number }}" >> $GITHUB_ENV

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/student-api:${{ env.IMAGE_TAG }} .

    - name: Push Docker Image
      run: docker push  ${{ secrets.DOCKERHUB_USERNAME }}/student-api:${{ env.IMAGE_TAG }}

    - name: Update Helm image tag
      run: |+
        sed -i -E '/^image:/,/^service:/ s/^(  tag:).*/\1 "'${IMAGE_TAG}'"/' \
          helm/student-api/values.yaml
          
    - name: Verify Helm values
      run: |
        grep -A3 '^image:' helm/student-api/values.yaml

    - name: Commit updated values.yaml
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add helm/student-api/values.yaml
        git commit -m "chore: update image tag to $IMAGE_TAG" || echo "No changes to commit"
        git push
